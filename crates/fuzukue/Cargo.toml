[package]
name = "fuzukue"
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Windows デスクトップクライアントと、Linux の任意の画面キャプチャ。
[workspace]

[features]
headless-shot = ["dep:gpui-shot"]

[target.'cfg(target_os = "linux")'.dependencies]
gpui-shot = { package = "gpui-pre", version = "=0.3.12", features = ["shot-element-bounds"], optional = true }
notify-rust = "=4.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSString"] }

[target.'cfg(windows)'.dependencies]
xcap = { version = "=0.9.8", features = ["wgc"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
raw-window-handle = "0.6"
fuzukue-proto = { path = "../fuzukue-proto" }
fuzukue-i18n = { path = "../fuzukue-i18n" }
fuzukue-view = { path = "../fuzukue-view" }
fuzukue-cards = { path = "../fuzukue-cards" }
gpui-kit = { version = "=0.10.0", features = [
    "tree-sitter", # JSON is included by the base feature.
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-bash",
    "tree-sitter-make",
    "tree-sitter-cmake",
    "tree-sitter-sql",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-lua",
    "tree-sitter-zig",
    "tree-sitter-kotlin",
    "tree-sitter-swift",
    "tree-sitter-scala",
    "tree-sitter-ruby",
] }
tree-sitter = "=0.26.13"
tree-sitter-r = "=1.3.0"
tree-sitter-julia = "=0.23.1"
arborium-lean = "=2.18.2"
tree-sitter-latex = { package = "codebook-tree-sitter-latex", version = "=0.6.1" }
gpui-pdf = { version = "=0.7.0", features = ["markup"] }
ureq = "2"
ratex-layout = "0.1.16"
ratex-parser = "0.1.16"
ratex-katex-fonts = "0.1.16"
ratex-types = "0.1.16"
ttf-parser = "0.25"
markdown = "1.0.0"
serde = { version = "1", features = ["derive"] }
lsp-types = "0.97"
url = "2"
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
toml = "0.8"
anyhow = "1"
base64 = "0.23.1"
tungstenite = "0.26"
futures = "0.3"
dirs = "6"
sys-locale = "=0.3.2"
chrono = "0.4"
tempfile = "3"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
unicode-script = "0.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[patch.crates-io]
gpui-base = { path = "../../vendor/gpui-base" }
gpui-pdf = { path = "../../vendor/gpui-pdf" }
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-pre-windows = { path = "../../vendor/gpui-pre-windows" }

[profile.dev]
debug = "line-tables-only"

[profile.test]
inherits = "dev"
