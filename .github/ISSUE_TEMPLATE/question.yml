name: Question / 質問・相談
description: Ask about usage or setup. / 使い方や設定について尋ねる。
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Leave out tokens and other sensitive information. Report vulnerabilities using [GitHub’s private reporting form](https://github.com/momota1029/fuzukue/security/advisories/new).

        この Issue は公開されます。トークンなどの機密情報は載せないでください。脆弱性は [GitHub の非公開の報告フォーム](https://github.com/momota1029/fuzukue/security/advisories/new) から報告してください。
  - type: textarea
    id: question
    attributes:
      label: Your question / 聞きたいこと
      description: |
        What would you like to know, or where are you stuck?

        知りたいことや、どこで迷っているかを教えてください。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Setup and what you tried (optional) / 環境と試したこと（任意）
      description: |
        If relevant, share your OS, version, clients or server, guides you read, and steps you tried.

        必要に応じて、OS、バージョン、使っているクライアントやサーバー、読んだガイドや試した手順を教えてください。
