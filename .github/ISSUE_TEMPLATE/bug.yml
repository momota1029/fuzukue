name: Bug report / 不具合報告
description: Report a problem in fuzukue. / fuzukue で起きた不具合を伝える。
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Report vulnerabilities using [GitHub’s private reporting form](https://github.com/momota1029/fuzukue/security/advisories/new).

        この Issue は公開されます。脆弱性は [GitHub の非公開の報告フォーム](https://github.com/momota1029/fuzukue/security/advisories/new) から報告してください。
  - type: textarea
    id: actual
    attributes:
      label: What happened / 起きたこと
      description: |
        Describe what happened and include any messages you saw.

        実際の動作や、画面に出たメッセージを教えてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期待した動作
      description: |
        What did you expect to happen?

        どのように動くと思っていましたか？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      description: |
        List the steps that led to the problem, in order.

        問題が起きるまでに行った操作を、順番に書いてください。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fuzukue version or build SHA / バージョンまたはビルド SHA
      description: |
        Share the version and the build SHA if available.

        分かる範囲で、バージョンとビルドのコミット SHA を書いてください。
  - type: dropdown
    id: component
    attributes:
      label: Affected components / 問題が起きた場所
      description: |
        Select the affected clients or server. You can select more than one.

        関係するクライアントやサーバーを選んでください。複数選べます。
      multiple: true
      options:
        - Desktop / デスクトップ
        - Android
        - Server (secretaire) / サーバー
        - Unsure / 分からない
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version / OS とバージョン
      description: |
        Share the OS names and versions, for both client and server if they differ.

        クライアントとサーバーで OS が異なる場合は、分かる範囲で両方を書いてください。
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional) / ログやスクリーンショット（任意）
      description: |
        Include only relevant excerpts. Remove tokens, credentials, tailnet names and addresses, personal file paths, email addresses, and private document contents.

        問題に関係する箇所だけ添えてください。ログや画像に含まれるトークン、認証情報、tailnet の名前やアドレス、個人のファイルパス、メールアドレス、非公開文書の内容は貼り付けないでください。
