name: 不具合報告
description: fuzukue で起きた不具合を伝える / Report a bug.
body:
  - type: markdown
    attributes:
      value: |
        この Issue は公開されます。セキュリティ上の問題は、詳細を書かずに「質問・相談」フォームで非公開の報告窓口を尋ねてください。

        This issue is public. Use the Question form to ask for a private channel without sharing vulnerability details.
  - type: textarea
    id: actual
    attributes:
      label: 起きたこと
      description: |
        実際の動作や、画面に出たメッセージを教えてください。

        What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: |
        どのように動くと思っていましたか？

        What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: |
        問題が起きるまでに行った操作を、順番に書いてください。

        What steps led to the bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョンまたはビルド ID
      description: |
        分かる範囲で、バージョン、ビルド ID、またはソースからビルドしたときのコミット ID を書いてください。

        Share a version, build ID, or commit ID if known.
  - type: dropdown
    id: component
    attributes:
      label: 問題が起きた場所
      description: |
        関係するクライアントやサーバーを選んでください。複数選べます。

        Select the affected clients or server.
      multiple: true
      options:
        - デスクトップ（Desktop）
        - Android
        - サーバー（secretaire）
        - 分からない（Unsure）
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS とバージョン
      description: |
        クライアントとサーバーで OS が異なる場合は、分かる範囲で両方を書いてください。

        Share the OS names and versions, for both ends if they differ.
  - type: textarea
    id: logs
    attributes:
      label: ログやスクリーンショット（任意）
      description: |
        問題に関係する箇所だけ添えてください。ログや画像に含まれるトークン、認証情報、tailnet の名前やアドレス、個人のファイルパス、非公開文書の内容は貼り付けないでください。

        Omit tokens, credentials, tailnet names and addresses, personal paths, and private documents.
