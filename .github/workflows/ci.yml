name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-macos-desktop:
        description: Build both macOS binaries with the clone setup script
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  linux:
    name: Rust workspace tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Test source installer with offline fixtures
        run: python3 scripts/release/test-setup-unix.py
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-
      # The shared test helper skips loopback tests if the runner cannot bind.
      - name: Test server and shared crates
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          unset FUZUKUE_SERVICE FUZUKUE_SELF_UPDATE_READY FUZUKUE_SELF_UPDATE_SOURCE
          cargo test --locked --workspace

  macos:
    name: Source setup and server compile check (macOS)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/fuzukue/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-
      - name: Preview setup from this clone
        run: |
          plan=$(sh scripts/setup-unix.sh --dry-run --skip-agents)
          printf '%s\n' "$plan"
          case "$plan" in
            *"Build secretaire and fuzukue for "*apple-darwin*) ;;
            *) exit 1 ;;
          esac
      - name: Check the server
        if: ${{ !inputs.build-macos-desktop }}
        run: cargo check --locked -p secretaire --jobs 2
      - name: Build the server and desktop from the clone
        if: ${{ inputs.build-macos-desktop }}
        env:
          CARGO_BUILD_JOBS: '2'
          TMPDIR: ${{ runner.temp }}
        run: sh scripts/setup-unix.sh --build-only

# Cards run in cards.yml. Android JVM tests run manually (see android/README.md).
